<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Recommend by User</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container my-5">
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
            <div class="container-fluid">
                <a href="../index.html" class="btn btn-outline-primary">Home</a>
            </div>
        </nav>

        <div class="card">
            <div class="card-body">
                <h2 class="card-title">Recommend by User</h2>
                <form action="http://localhost:8080/users/recommendations" method="get" id="search-form" class="row g-3">
                    <div class="col-md-6">
                        <label for="gender" class="form-label">Gender:</label>
                        <input type="text" class="form-control" id="gender" name="gender">
                    </div>
                    <div class="col-md-6">
                        <label for="age" class="form-label">Age:</label>
                        <input type="text" class="form-control" id="age" name="age">
                    </div>
                    <div class="col-md-6">
                        <label for="occupation" class="form-label">Occupation:</label>
                        <input type="text" class="form-control" id="occupation" name="occupation">
                    </div>
                    <div class="col-md-6">
                        <label for="genre" class="form-label">Genre:</label>
                        <input type="text" class="form-control" id="genre" name="genre">
                    </div>
                    <div class="col-md-6">
                        <label for="limit" class="form-label">Limit:</label>
                        <input type="text" class="form-control" id="limit" name="limit">
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="row justify-content-center" id="results-container">
            <!-- Placeholder for top recommended movies -->
        </div>
        
    </div>

    <script src="GetUserRec.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
