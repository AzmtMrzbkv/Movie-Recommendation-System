<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Recommend by Fav Movie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container my-5">
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
            <div class="container-fluid">
                <a href="../index.html" class="btn btn-outline-primary">Home</a>
            </div>
        </nav>

        <div class="card">
            <div class="card-body">
                <h2 class="card-title">Recommend by Favorite Movie</h2>
                <form action="http://localhost:8080/movies/recommendations" method="get" id="search-form" class="row g-3">
                    <div class="col-md-6">
                        <label for="title" class="form-label">Movie Title:</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="col-md-6">
                        <label for="limit" class="form-label">Limit:</label>
                        <input type="text" class="form-control" id="limit" name="limit">
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="row justify-content-center" id="results-container">
            <!-- Placeholder for top recommended movies -->
        </div>

    </div>
    <script src="GetMovieRec.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
